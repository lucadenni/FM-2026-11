<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2878b8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dieta Federica"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Dieta Federica</title><style>
:root{--c:#2878b8;--p:#eaf4fb;--ink:#183448;--muted:#6b7c88;--bg:#f5f8fa;--line:#e1e9ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:linear-gradient(135deg,#236fae,#4698d0);color:white;padding:22px 18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;font-size:13px}nav{display:flex;gap:7px;overflow:auto;padding:10px;background:white;position:sticky;top:80px;z-index:4}button{cursor:pointer}nav button{border:0;background:#eef4f8;color:var(--c);border-radius:24px;padding:9px 13px;font-weight:bold;white-space:nowrap}nav button.active{background:var(--c);color:white}main{max-width:760px;margin:auto;padding:14px}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font-size:16px}.short{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0}.short button,.water button{background:white;border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--ink);text-align:left;font-weight:bold}.short small{display:block;color:var(--muted);font-weight:normal;margin-top:3px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.meal{border-top:1px solid var(--line);padding:14px 0 3px}.meal h3{margin:0 0 9px;color:var(--c);font-size:16px}.item{display:flex;gap:10px;margin:9px 0;line-height:1.4;font-size:15px}.item input{width:18px;height:18px;accent-color:var(--c);flex-shrink:0}.done span{text-decoration:line-through;opacity:.5}.note{font-size:13px;color:var(--muted);line-height:1.5}.water{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.water button{color:var(--c);text-align:center}.water .on{background:var(--p)}ul{line-height:1.55;padding-left:20px}footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}@media(min-width:650px){.short{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>🩵 Dieta Federica</h1><p>Piano alimentare settimanale · 10/11/2026</p></header><nav id="nav"></nav><main><input id="search" class="search" placeholder="Cerca un alimento, un pasto o una quantità…"><div class="short"><button onclick="showDay((new Date().getDay()+6)%7)">📅 Oggi<small>Vai al giorno corrente</small></button><button onclick="showSubs()">🔄 Sostituzioni<small>Alternative del piano</small></button><button onclick="showWater()">💧 Acqua<small>Schema e indicazioni</small></button><button onclick="resetAll()">↺ Reset<small>Azzera le spunte</small></button></div><section id="content"></section></main><footer>Contenuti trascritti dal PDF fornito. Piano personale: fai riferimento alla professionista che lo ha elaborato.</footer>
<script>
const breakfast=[
"1 vasetto di kefir bianco + 30g cereali di mais (es. cornflakes) + 2 noci",
"150g latte Zymil o latte vegetale senza zuccheri aggiunti + 6 biscotti Oro Saiwa senza glutine",
"2 fette biscottate senza glutine + 1 velo di marmellata Hero + 5 mandorle",
"50g pane senza glutine + 2 cucchiaini di marmellata (preferibilmente Hero light e scura) + 5 mandorle",
"Pancakes con 40g farina di riso + 100g albume + 2 cucchiaini di marmellata + 5 mandorle",
"Porridge con 40g fiocchi di avena senza glutine + 150g latte vegetale senza zuccheri aggiunti + 1 cucchiaino burro di arachidi 100%"
];
const days=[
["Lunedì",[["Spuntino",["10 mandorle"]],["Pranzo",["60g pasta di grano saraceno + 100g scamorza","Verdura cotta e/o cruda a volontà","1 ½ cucchiaio olio EVO"]],["Spuntino",["30g parmigiano"]],["Cena",["Zuppa di lenticchie: 30g pasta di mais + 150g lenticchie cotte decorticate","Verdura cotta e/o cruda a volontà","1 ½ cucchiaio olio EVO"]]]],
["Martedì",[["Spuntino",["30g parmigiano"]],["Pranzo",["60g riso lungo B + 80g tonno ben sgocciolato","Verdura cotta e/o cruda a volontà","1 ½ cucchiaio olio EVO"]],["Spuntino",["150g frutta fresca + 20g cioccolata fondente >80%"]],["Cena",["2 uova strapazzate","60g pane senza glutine","Verdura cotta e/o cruda a volontà","1 ½ cucchiaio olio EVO"]]]],
["Mercoledì",[["Spuntino",["20g anacardi"]],["Pranzo",["60g pasta di riso + 150g misto di pesce","Verdura cotta o cruda","1 cucchiaio olio EVO"]],["Spuntino",["1 yogurt bianco senza lattosio + 1 banana poco matura"]],["Cena",["150g patate + 150g petto di pollo alla piastra","Verdura cotta o cruda","1 cucchiaio olio EVO"]]]],
["Giovedì",[["Spuntino",["20g cioccolata fondente >80%"]],["Pranzo",["60g riso tipo B + 2 uova","Verdura cotta o cruda","1 cucchiaio olio EVO"]],["Spuntino",["150g frutta fresca + 2 noci"]],["Cena",["200g spigola + 60g pane senza glutine","Verdura cotta o cruda","1 cucchiaio olio EVO"]]]],
["Venerdì",[["Spuntino",["1 quadratino cioccolata fondente >80%"]],["Pranzo",["60g pasta di riso + 100g macinato di carne a scelta","Verdura cotta e/o cruda a volontà","1 ½ cucchiaio olio EVO"]],["Spuntino",["1 vasetto di kefir bianco"]],["Cena",["Vellutata di zucca + 2 cucchiai di parmigiano","60g pane senza glutine","Verdura cotta e/o cruda a volontà","1 ½ cucchiaio olio EVO"]]]],
["Sabato",[["Spuntino",["1 yogurt bianco senza lattosio"]],["Pranzo",["60g pane senza glutine + 150g straccetti di manzo o pesce a scelta","Verdura cotta e/o cruda a volontà","1 ½ cucchiaio olio EVO"]],["Spuntino",["20g nocciole"]],["Cena",["Pasto libero"]]]],
["Domenica",[["Spuntino",["1 yogurt alla frutta senza zuccheri aggiunti"]],["Pranzo",["60g pasta + condimento a scelta tra carne e pesce","Verdura cotta e/o cruda a volontà","1 cucchiaio olio EVO"]],["Spuntino",["20g cioccolata fondente >80%"]],["Cena",["Minestrone misto + 50g pasta senza glutine + 1 cucchiaio di parmigiano","Verdura cotta e/o cruda a volontà","1 cucchiaio olio EVO"]]]]
];
const subs=[
["Cereali / pasta / pane",["50g pasta di grano saraceno, di riso, riso integrale, riso basmati, riso venere, quinoa, miglio, grano saraceno","50g pane senza glutine"]],
["Carne",["150g petto di pollo, petto di tacchino, manzo, vitello, maiale","100g fesa di tacchino/petto di pollo affettato","100g bresaola","100g prosciutto cotto magro","2 uova"]],
["Pesce",["200g calamari, merluzzo, nasello, trota, baccalà, sgombro, alici, sardine, seppie, dentice, rombo, spigola, orata, pesce spada, razza, triglia, acciughe","100g salmone/pesce spada affumicato","200g salmone fresco","200g tonno fresco","100g tonno in scatola o in barattolo ben sgocciolato","2 uova"]],
["Latticini (senza lattosio)",["100g ricotta di mucca","100g primo sale","100g mozzarella di mucca","250g fiocchi di latte"]]
];
let current=0, checks=JSON.parse(localStorage.getItem("fedChecks")||"{}");
const nav=document.getElementById("nav");days.forEach((d,i)=>{let b=document.createElement("button");b.textContent=d[0];b.onclick=()=>showDay(i);nav.appendChild(b)});
function item(t,k){let c=!!checks[k];return `<label class="item ${c?'done':''}"><input type="checkbox" ${c?'checked':''} onchange="toggle('${k}',this)"><span>${t}</span></label>`}
function showDay(i){current=i;nav.querySelectorAll("button").forEach((b,n)=>b.classList.toggle("active",n===i));document.getElementById("search").value="";let d=days[i],h=`<div class="card"><h2>${d[0]}</h2><div class="meal"><h3>☕ Colazione · scegli 1 alternativa</h3>${breakfast.map((x,j)=>item(x,'bf'+j)).join("")}</div>`;d[1].forEach((m,mi)=>h+=`<div class="meal"><h3>${m[0]}</h3>${m[1].map((x,j)=>item(x,`${i}-${mi}-${j}`)).join("")}</div>`);h+="</div><div class='card note'>Le spunte vengono conservate nel browser di questo dispositivo.</div>";document.getElementById("content").innerHTML=h}
function showSubs(){nav.querySelectorAll("button").forEach(b=>b.classList.remove("active"));let h='<div class="card"><h2>🔄 Sostituzioni</h2>';subs.forEach(s=>h+=`<div class="meal"><h3>${s[0]}</h3>${s[1].map(x=>`<p>• ${x}</p>`).join("")}</div>`);h+='<p class="note">Per i legumi, il PDF specifica che la quantità è riferita al peso cotto (es. in barattolo, previo risciacquo o post cottura); il peso da secco/crudo è 50g. L’indicazione vale per tutti i legumi presenti nella dieta.</p></div>';document.getElementById("content").innerHTML=h}
function showWater(){nav.querySelectorAll("button").forEach(b=>b.classList.remove("active"));let a=JSON.parse(localStorage.getItem("fedWater")||"[]");let h='<div class="card"><h2>💧 Fabbisogno idrico</h2><p>Schema orario riportato nel PDF:</p><div class="water">';["09–12 · 0,5 L","13–14 · 0,5 L","15–18 · 0,5 L","19–22 · 0,5 L"].forEach((x,i)=>h+=`<button class="${a[i]?'on':''}" onclick="water(${i})">${a[i]?'✓ ':''}${x}</button>`);h+='</div><p class="note">Il PDF indica come obiettivo generale 2,5 L al giorno, ma le quattro fasce orarie sommano 2 L. Sono state mantenute entrambe le indicazioni senza correzioni.</p><p class="note">Acque consigliate: San Benedetto, Levissima, Egeria e Lauretana.</p></div><div class="card"><h2>📌 Indicazioni e consigli</h2><ul><li>Verdura obbligatoria: almeno 200g per pasto.</li><li>Preferire cotture salutari: padella, vapore, forno, bollito, cartoccio.</li><li>Usare olio extra vergine di oliva preferibilmente a crudo.</li><li>Uova intere: massimo 2, due volte a settimana.</li><li>Pesare gli alimenti a crudo e al netto degli scarti.</li><li>Bere solo acqua ed evitare bevande gassose e alcol.</li><li>Bere 2,5 L di acqua al giorno.</li><li>Limitare il sale; insaporire con spezie e/o odori.</li><li>Associare attività fisica alla corretta alimentazione.</li><li>Non saltare le portate e masticare lentamente.</li><li>Evitare di zuccherare il caffè.</li><li>Se si ha fame tra gli spuntini, il PDF suggerisce finocchi, sedano e carote crude a volontà.</li></ul></div>';document.getElementById("content").innerHTML=h}
function water(i){let a=JSON.parse(localStorage.getItem("fedWater")||"[]");a[i]=!a[i];localStorage.setItem("fedWater",JSON.stringify(a));showWater()}
function toggle(k,e){checks[k]=e.checked;localStorage.setItem("fedChecks",JSON.stringify(checks));e.closest(".item").classList.toggle("done",e.checked)}
function resetAll(){checks={};localStorage.removeItem("fedChecks");showDay(current)}
document.getElementById("search").addEventListener("input",e=>{let q=e.target.value.toLowerCase().trim();if(!q){showDay(current);return}nav.querySelectorAll("button").forEach(b=>b.classList.remove("active"));let r=[];days.forEach(d=>d[1].forEach(m=>m[1].forEach(x=>{if((d[0]+" "+m[0]+" "+x).toLowerCase().includes(q))r.push(`<div class="meal"><h3>${d[0]} · ${m[0]}</h3><p>${x}</p></div>`)})));let b=breakfast.filter(x=>x.toLowerCase().includes(q)).map(x=>`<p>Colazione: ${x}</p>`);document.getElementById("content").innerHTML=`<div class="card"><h2>🔎 Risultati</h2>${b.join("")}${r.join("")}${!b.length&&!r.length?"Nessun risultato":""}</div>`});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});showDay(0);
</script></body></html>
